<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@500;700;900&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root{
    --bg1:#0e0a08; --bg2:#1b130e;
    --gold:#d3a625; --gold-hi:#f6dd8f; --gold-lo:#8a6514;
    --parch:#efe2c2; --parch-dark:#d9c393; --ink:#2e1f12;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    font-family:"IM Fell English",Georgia,serif; color:var(--parch); font-size:18px;
    background:
      radial-gradient(ellipse 60% 40% at 50% 0%, rgba(211,166,37,.18) 0%, transparent 70%),
      radial-gradient(ellipse at 10% 60%, rgba(116,0,1,.25) 0%, transparent 45%),
      radial-gradient(ellipse at 90% 70%, rgba(14,26,64,.45) 0%, transparent 45%),
      linear-gradient(180deg,var(--bg1) 0%, var(--bg2) 100%);
    background-attachment:fixed; min-height:100vh; overflow-x:hidden;
  }
  #embers{position:fixed;inset:0;pointer-events:none;z-index:0}
  .wrap{position:relative;z-index:1;max-width:1150px;margin:0 auto;padding:24px 20px 60px}

  /* ---------- Header ---------- */
  header{text-align:center;padding:10px 0 4px}
  .logo{width:170px;height:170px;border-radius:50%;display:block;margin:0 auto;
        box-shadow:0 0 0 4px #0e0a08,0 0 0 7px var(--gold),0 0 45px rgba(211,166,37,.45)}
  .eyebrow{font-family:Cinzel,serif;letter-spacing:.4em;font-size:13px;color:var(--gold);text-transform:uppercase;margin-top:22px}
  h1{font-family:"Cinzel Decorative",Cinzel,serif;font-weight:900;font-size:clamp(38px,6.5vw,70px);margin:6px 0 2px;
     background:linear-gradient(180deg,#fff3c4 0%,var(--gold-hi) 30%,var(--gold) 60%,var(--gold-lo) 100%);
     -webkit-background-clip:text;background-clip:text;color:transparent;
     filter:drop-shadow(0 2px 0 rgba(0,0,0,.6)) drop-shadow(0 0 22px rgba(211,166,37,.3))}
  .tagline{font-style:italic;color:#e6d6b0;font-size:21px;margin:0}
  .flourish{display:block;margin:14px auto 0;width:260px;height:20px}

  /* ---------- Leader banner ---------- */
  .leader{position:relative;margin:28px auto 6px;max-width:700px;text-align:center;padding:16px 24px 18px;
          background:linear-gradient(180deg,var(--parch) 0%,var(--parch-dark) 100%);color:var(--ink);
          border-radius:6px;box-shadow:0 8px 30px rgba(0,0,0,.55), inset 0 0 40px rgba(120,80,20,.3);
          border:2px solid var(--gold-lo); outline:1px solid var(--gold); outline-offset:-8px}
  .leader .lbl{font-family:Cinzel,serif;font-size:13px;letter-spacing:.3em;color:#7a5520;text-transform:uppercase}
  .leader .who{font-family:Cinzel,serif;font-size:clamp(24px,4vw,36px);font-weight:900;margin-top:2px}

  /* ---------- House cards ---------- */
  .houses{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-top:30px}
  @media (max-width:880px){.houses{grid-template-columns:repeat(2,1fr)}}
  .house{position:relative;border-radius:10px;padding:16px 12px 18px;text-align:center;overflow:hidden;
         background:
           radial-gradient(ellipse at 50% 0%, rgba(255,255,255,.18), transparent 60%),
           linear-gradient(180deg,var(--c1) 0%, var(--c2) 100%);
         border:3px solid transparent;
         border-image:linear-gradient(160deg,var(--m1),var(--m2) 40%,var(--m1) 60%,var(--m2)) 1;
         box-shadow:0 14px 34px rgba(0,0,0,.55), inset 0 0 40px rgba(0,0,0,.35);
         transition:transform .3s}
  .house:hover{transform:translateY(-5px)}
  .house.first{box-shadow:0 0 38px rgba(246,221,143,.55),0 14px 34px rgba(0,0,0,.55), inset 0 0 40px rgba(0,0,0,.35)}
  .ribbon{position:absolute;top:12px;left:-1px;padding:4px 12px 4px 10px;font-family:Cinzel,serif;font-weight:900;font-size:14px;
          background:linear-gradient(90deg,var(--m2),var(--m1));color:var(--rt);clip-path:polygon(0 0,100% 0,88% 50%,100% 100%,0 100%)}
  .cup{position:absolute;top:8px;right:10px;width:30px;height:30px}
  .crest{width:118px;height:138px;display:block;margin:6px auto 4px;filter:drop-shadow(0 6px 8px rgba(0,0,0,.5))}
  .house h2{font-family:Cinzel,serif;font-weight:900;font-size:22px;margin:2px 0 12px;color:var(--t);letter-spacing:.06em;
            text-shadow:0 2px 3px rgba(0,0,0,.35)}
  .tube{position:relative;height:190px;width:70px;margin:0 auto;border-radius:35px 35px 14px 14px;
        background:rgba(0,0,0,.4);border:3px solid var(--m1);overflow:hidden;
        box-shadow:inset 0 0 14px rgba(0,0,0,.7),0 0 0 1px rgba(0,0,0,.4)}
  .fill{position:absolute;left:0;right:0;bottom:0;height:0;transition:height 1.8s cubic-bezier(.2,.9,.2,1);
        background:
          radial-gradient(circle at 30% 30%,rgba(255,255,255,.7) 0 2.5px,transparent 3.5px) 0 0/16px 14px,
          radial-gradient(circle at 70% 70%,rgba(255,255,255,.4) 0 3px,transparent 4px) 4px 3px/20px 18px,
          linear-gradient(180deg,var(--gem) 0%, color-mix(in srgb,var(--gem) 55%,#000) 100%)}
  .tube::after{content:"";position:absolute;top:8px;left:9px;width:9px;height:70%;border-radius:8px;
               background:linear-gradient(180deg,rgba(255,255,255,.5),rgba(255,255,255,0))}
  .pts{font-family:Cinzel,serif;font-weight:900;font-size:42px;margin-top:10px;color:var(--t);line-height:1;
       text-shadow:0 2px 3px rgba(0,0,0,.35)}
  .pts small{display:block;font-size:12px;letter-spacing:.3em;margin-top:4px;opacity:.85}

  /* ---------- Parchment sections ---------- */
  section.parch{position:relative;margin-top:46px;
    background:
      radial-gradient(ellipse at 15% 10%,rgba(255,255,255,.45),transparent 50%),
      radial-gradient(ellipse at 85% 90%,rgba(140,90,30,.25),transparent 55%),
      linear-gradient(180deg,var(--parch) 0%, var(--parch-dark) 100%);
    color:var(--ink);border-radius:6px;padding:28px 28px 32px;
    box-shadow:0 14px 40px rgba(0,0,0,.6), inset 0 0 70px rgba(110,70,20,.35);
    border:2px solid var(--gold-lo); outline:1px solid rgba(138,101,20,.6); outline-offset:-10px}
  section.parch h3{font-family:Cinzel,serif;font-weight:900;font-size:27px;margin:0 0 2px;color:#5a1a0c;text-align:center}
  section.parch .sub{margin:0 0 18px;color:#6b5434;font-style:italic;text-align:center}

  .chart-wrap{width:100%;overflow-x:auto}
  #chart{width:100%;min-width:620px;height:auto;display:block}
  .legend{display:flex;flex-wrap:wrap;justify-content:center;gap:18px;margin-top:10px;font-family:Cinzel,serif;font-size:14px;font-weight:700}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .legend i{width:14px;height:14px;border-radius:50%;display:inline-block;border:1.5px solid rgba(0,0,0,.3)}

  .log{display:grid;gap:14px}
  .ch{display:grid;grid-template-columns:46px 1fr;gap:14px;align-items:start;padding:14px 16px;border-radius:6px;
      background:rgba(255,250,235,.5);border:1px solid rgba(110,80,30,.3)}
  .ch .num{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-family:Cinzel,serif;font-weight:900;
           background:radial-gradient(circle at 35% 30%,#b3201f,#5a0a0a);color:var(--gold-hi);font-size:18px;
           box-shadow:0 2px 4px rgba(0,0,0,.4), inset 0 0 0 2px rgba(0,0,0,.25)}
  .ch h4{font-family:Cinzel,serif;font-weight:700;margin:0 0 8px;font-size:19px;color:#3a2410}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:4px;font-size:16px;
        font-family:Cinzel,serif;font-weight:700;border:1px solid rgba(0,0,0,.25)}
  .chip.zero{opacity:.45}
  .tag{font-family:Cinzel,serif;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#7a5a2a;margin:10px 0 6px}

function parseCSV(text){
  const rows=[]; let row=[], f="", q=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(q){ if(ch=='"'){ if(text[i+1]=='"'){f+='"';i++;} else q=false; } else f+=ch; }
    else if(ch=='"') q=true;
    else if(ch==','){ row.push(f); f=""; }
    else if(ch=='\n'){ row.push(f); rows.push(row); row=[]; f=""; }
    else if(ch!='\r') f+=ch;
  }
  if(f!=="" || row.length){ row.push(f); rows.push(row); }
  return rows;
}

function toEntries(rows){
  return rows.map(r=>({
    challenge:(r[0]||"").trim(),
    type:(r[1]||"").trim(),
    pts:HOUSES.map(h=>{const n=parseFloat(r[h.col]); return isNaN(n)?0:n;}),
    note:(r[6]||"").trim()
  })).filter(e=>e.challenge);
}

/* Rows that share a challenge name (placement + bonus) are shown together */
function groupChallenges(entries){
  const groups=[]; const idx={};
  entries.forEach(e=>{
    if(!(e.challenge in idx)){ idx[e.challenge]=groups.length; groups.push({name:e.challenge, parts:[]}); }
    groups[idx[e.challenge]].parts.push(e);
  });
  groups.forEach(g=>g.total=HOUSES.map((_,i)=>g.parts.reduce((s,p)=>s+p.pts[i],0)));
  return groups;
}

function esc(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function ordinal(n){const s=["th","st","nd","rd"],v=n%100;return n+(s[(v-20)%10]||s[v]||s[0]);}

function render(entries){
  const groups=groupChallenges(entries);
  const totals=HOUSES.map((_,i)=>entries.reduce((s,e)=>s+e.pts[i],0));
  const places=totals.map(t=>1+totals.filter(o=>o>t).length);
  const max=Math.max(1,...totals);

  const top=HOUSES.filter((_,i)=>places[i]===1);
  document.getElementById("leaderLbl").textContent = top.length>1 ? "Tied for the lead" : "Currently leading";
  const who=document.getElementById("leaderWho");
  who.textContent = top.map(h=>h.key).join(" & ") + ` with ${Math.max(...totals)} points`;
  who.style.color = top.length===1 ? (top[0].key==="Hufflepuff" ? "#9a6b00" : top[0].line) : "#5a1a0c";

  const hc=document.getElementById("houses");
  hc.innerHTML=HOUSES.map((h,i)=>`
    <div class="house ${places[i]===1?'first':''}" style="--c1:${h.c1};--c2:${h.c2};--m1:${h.m1};--m2:${h.m2};--t:${h.t};--rt:${h.rt};--gem:${h.gem}">
      <div class="ribbon">${ordinal(places[i])}</div>
      ${places[i]===1?CUP:''}
      ${crestSVG(h)}
      <h2>${h.key}</h2>
      <div class="tube"><div class="fill" data-h="${(totals[i]/max*100).toFixed(1)}"></div></div>
      <div class="pts">${totals[i]}<small>POINTS</small></div>
    </div>`).join("");
  requestAnimationFrame(()=>setTimeout(()=>hc.querySelectorAll(".fill").forEach(f=>f.style.height=f.dataset.h+"%"),60));

  drawChart(groups);

  document.getElementById("log").innerHTML=groups.map((g,gi)=>({g,gi})).reverse().map(({g,gi})=>`
    <div class="ch">
      <div class="num">${gi+1}</div>
      <div>
        <h4>${esc(g.name)}</h4>
        ${g.parts.map(p=>{
          const placement=p.type.toLowerCase()==="placement";
          return `${g.parts.length>1||!placement?`<div class="tag">${esc(p.type||"Points")}</div>`:""}
          <div class="chips">
            ${HOUSES.map((h,i)=>p.pts[i]||placement?`<span class="chip ${p.pts[i]?'':'zero'}" style="background:${h.chipBg};color:${h.chipFg}">${h.key} +${p.pts[i]}</span>`:"").join("")}
          </div>
          ${p.note?`<div class="note">${esc(p.note)}</div>`:""}`;}).join("")}
      </div>
    </div>`).join("");

  document.getElementById("legend").innerHTML=HOUSES.map(h=>`<span><i style="background:${h.line}"></i>${h.key}</span>`).join("");

  document.getElementById("updated").textContent=`Live from the official points sheet · checked ${new Date().toLocaleTimeString([], {hour:"numeric",minute:"2-digit"})}`;
  document.getElementById("loading").style.display="none";
  document.getElementById("content").style.display="block";
}

function drawChart(groups){
  const svg=document.getElementById("chart");
  const W=900,H=370,L=50,R=24,T=20,B=80;
  const n=groups.length;
  const cum=HOUSES.map(()=>[0]);
  groups.forEach(g=>HOUSES.forEach((_,i)=>cum[i].push(cum[i][cum[i].length-1]+g.total[i])));
  const maxY=Math.max(5,...cum.flat());
  const step=maxY<=20?2:maxY<=50?5:10;
  const top=Math.ceil(maxY/step)*step;
  const x=k=>L+(W-L-R)*(n?k/n:0);
  const y=v=>T+(H-T-B)*(1-v/top);
  let s="";
  for(let v=0;v<=top;v+=step){
    s+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="#6b5434" stroke-opacity=".2"/>`;
    s+=`<text x="${L-10}" y="${y(v)+5}" text-anchor="end" font-size="14" fill="#6b5434" font-family="IM Fell English,serif">${v}</text>`;
  }
  const labels=["Start",...groups.map(g=>g.name)];
  labels.forEach((lab,k)=>{
    const short=lab.length>22?lab.slice(0,21)+"…":lab;
    s+=`<text transform="translate(${x(k)},${H-B+16}) rotate(-28)" text-anchor="end" font-size="14" fill="#3a2410" font-family="IM Fell English,serif">${esc(short)}</text>`;
  });
  HOUSES.forEach((h,i)=>{
    const pts=cum[i].map((v,k)=>`${x(k)},${y(v)}`).join(" ");
    s+=`<polyline points="${pts}" fill="none" stroke="${h.line}" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>`;
    cum[i].forEach((v,k)=>{ if(k) s+=`<circle cx="${x(k)}" cy="${y(v)}" r="5" fill="${h.line}" stroke="#efe2c2" stroke-width="1.5"><title>${h.key}: ${v} after ${esc(labels[k])}</title></circle>`; });
  });
  svg.innerHTML=s;
}

async function load(){
  try{
    const res=await fetch(csvUrl(),{cache:"no-store"});
    const text=await res.text();
    if(!res.ok || text.trim().startsWith("<")) throw new Error("not-shared");
    render(toEntries(parseCSV(text)));
    document.getElementById("err").style.display="none";
  }catch(e){
    if(window.FALLBACK_DATA){ render(toEntries(window.FALLBACK_DATA)); return; }
    const el=document.getElementById("err");
    el.style.display="block";
    el.textContent="Couldn't read the points sheet. Check that it's shared as \"Anyone with the link can view\".";
    document.getElementById("loading").style.display="none";
  }
}

/* Rising candle embers */
(function(){
  const c=document.getElementById("embers"),x=c.getContext("2d");let ps=[];
  const mk=()=>({x:Math.random()*c.width,y:c.height+Math.random()*c.height,r:Math.random()*1.8+.4,
                 v:Math.random()*.35+.12,d:Math.random()*6.28,a:Math.random()*.5+.25});
  function size(){c.width=innerWidth;c.height=innerHeight;ps=Array.from({length:Math.round(innerWidth/18)},()=>{const p=mk();p.y=Math.random()*c.height;return p;});}
  function draw(t){
    x.clearRect(0,0,c.width,c.height);
    ps.forEach(p=>{
      p.y-=p.v; p.x+=Math.sin(t/1400+p.d)*.25;
      if(p.y<-10) Object.assign(p,mk(),{y:c.height+10});
      const g=x.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r*4);
      g.addColorStop(0,`rgba(255,214,120,${p.a})`); g.addColorStop(1,"rgba(255,160,40,0)");
      x.fillStyle=g; x.beginPath(); x.arc(p.x,p.y,p.r*4,0,6.28); x.fill();
    });
    requestAnimationFrame(draw);
  }
  addEventListener("resize",size);size();requestAnimationFrame(draw);
})();

load();
setInterval(load, CONFIG.REFRESH_MINUTES*60*1000);
</script>
